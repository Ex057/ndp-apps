name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply tag version to application manifests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/set-release-version.mjs "${RELEASE_TAG#v}"

      - name: Test Results Framework
        run: yarn workspace dhis-web-results-framework test --runInBand --watchAll=false

      - name: Test Performance Data Entry
        run: yarn workspace performance-data-entry test --runInBand --watchAll=false

      - name: Test release and rollback tooling
        run: yarn test:tooling

      - name: Build Results Framework
        run: yarn workspace dhis-web-results-framework build

      - name: Build Performance Data Entry
        run: yarn workspace performance-data-entry build

      - name: Prepare release assets and checksums
        run: |
          mkdir -p release-assets
          cp dhis-web-results-framework/build/bundle/*.zip release-assets/
          cp performance-data-entry/build/bundle/*.zip release-assets/
          cd release-assets
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Verify release bundle manifests
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/verify-release-bundles.mjs "${RELEASE_VERSION#v}" release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --verify-tag
          --generate-notes
          --title "NDP Apps ${GITHUB_REF_NAME}"
