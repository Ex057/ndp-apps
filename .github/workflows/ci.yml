name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build applications
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test Results Framework
        run: yarn workspace dhis-web-results-framework test --runInBand --watchAll=false

      - name: Test Performance Data Entry
        run: yarn workspace performance-data-entry test --runInBand --watchAll=false

      - name: Test rollback tooling
        run: yarn test:rollback

      - name: Build Results Framework
        run: yarn workspace dhis-web-results-framework build

      - name: Build Performance Data Entry
        run: yarn workspace performance-data-entry build

      - name: Upload Results Framework bundle
        uses: actions/upload-artifact@v4
        with:
          name: results-framework-${{ github.sha }}
          path: dhis-web-results-framework/build/bundle/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Performance Data Entry bundle
        uses: actions/upload-artifact@v4
        with:
          name: performance-data-entry-${{ github.sha }}
          path: performance-data-entry/build/bundle/*.zip
          if-no-files-found: error
          retention-days: 30
